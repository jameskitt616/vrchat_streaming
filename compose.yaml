networks:
  neko-v3:
    driver: bridge

services:
  neko:
    image: ghcr.io/m1k1o/neko/intel-firefox:latest
    container_name: neko-v3
    restart: unless-stopped
    shm_size: 4gb
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/dri:/dev/dri
    networks:
      - neko-v3
    ports:
      - "80:8080"                    # Web interface
      - "52000-52100:52000-52100/udp"  # WebRTC
    environment:
      TZ: "Europe/Berlin"
      NEKO_SERVER_PROXY: "true"

      # ---- WebRTC ----
      #NEKO_WEBRTC_NAT1TO1: "192.168.x.x" # This setting is required only to access Neko locally (using the server's local IP) without a reverse proxy. To access it via a domain, this setting can be removed.
      NEKO_WEBRTC_EPR: "52101-52110"
      NEKO_WEBRTC_ICELITE: "1"

      # ---- Desktop ----
      NEKO_DESKTOP_SCREEN: "1920x1080@30"

      # ---- Auth ----
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "changeMe"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "changeMe"
      NEKO_SESSION_CONTROL_PROTECTION: "true"

      # ---- Capture Broadcast pipeline ----
      NEKO_CAPTURE_VIDEO_CODEC: "h264"
      NEKO_CAPTURE_BROADCAST_URL: "rtmp://rtsp_server:1935/live"
      NEKO_CAPTURE_BROADCAST_AUTOSTART: false

      NEKO_CAPTURE_VIDEO_PIPELINE: "ximagesrc display-name={display} show-pointer=true use-damage=false ! video/x-raw,framerate=30/1 ! queue max-size-buffers=300 leaky=downstream ! videoconvert ! video/x-raw,format=NV12 ! vaapih264enc rate-control=cbr bitrate=6144 keyframe-period=10 quality-level=2 ! h264parse config-interval=1 ! video/x-h264,stream-format=byte-stream,profile=main ! appsink name=appsink"
      NEKO_CAPTURE_BROADCAST_PIPELINE: "flvmux name=mux ! queue ! rtmpsink location={url} async=false ximagesrc display-name={display} show-pointer=true use-damage=false ! video/x-raw,framerate=30/1 ! queue max-size-buffers=300 leaky=downstream ! videoconvert ! video/x-raw,format=NV12 ! vaapih264enc rate-control=cbr bitrate=6144 keyframe-period=10 quality-level=2 ! h264parse config-interval=1 ! video/x-h264,stream-format=avc,alignment=au ! queue max-size-buffers=300 ! mux. pulsesrc device={device} ! audio/x-raw,channels=2 ! queue max-size-buffers=300 leaky=downstream ! audioconvert ! voaacenc bitrate=320000 ! audio/mpeg,rate=48000 ! aacparse ! queue max-size-buffers=300 ! mux."

  rtsp_server:
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    networks:
      - neko-v3
    ports:
      - "8554:8554"  # RTSP output e.g. rtsp://server-ip:8555/live (RTSP playback doesn't work for Standalone Headsets, only for PC)
      - "8888:8888"  # HLS output e.g. http://server-ip:8889/live/index.m3u8, https://domain.tld/live/index.m3u8
      - "1935:1935"  # RTMP
    environment:
      MTX_PROTOCOLS: tcp
      MTX_HLSALWAYSREMUX: yes
      MTX_HLSVARIANT: mpegts
      MTX_HLSSEGMENTCOUNT: 4
      MTX_HLSSEGMENTDURATION: 1s
